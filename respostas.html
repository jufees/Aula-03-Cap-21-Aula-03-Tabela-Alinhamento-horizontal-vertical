<!DOCTYPE html>
<html lang="pt br">
<head>
    <meta charset="UTF-8">
    <title>Document</title>

     <style>

h1 {
  font-family: "Montserrat Alternates", sans-serif;
  font-weight: 200;
  font-style: italic;
  
}

table {
    border: 1px solid rgb(43, 116, 158);
    border-spacing: 0px;
    
}

table td {
    border: 1px solid rgb(43, 116, 158);
    padding: 8px;
}

.texto-esquerda {
    text-align: left;
}

.texto-centro {
    text-align: center;
}

.texto-direita {
    text-align: right;
}

.texto-acima {
    vertical-align: top;
    text-align: center;
}

.texto-abaixo{
    vertical-align: bottom;
    text-align: center;
}

caption {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 200;
    font-style: Arial;
}

span {
    display: block;
    float: right;
}

     </style>


</head>

<body>

     <h1 style="color: rgb(20, 28, 32);">Gabarito - Trabalhando com alinhamento</h1>

    <table>

      <caption>Tabela de Alinhamento <span>:D</span></caption>
        <tbody>

            <tr style="height: 72px;">
                <td class="texto-esquerda" style="background-color: rgb(42, 56, 70); width: 120px;">A1<br>(esquerda)</td>
                <td class="texto-centro" style="width: 180px;">B1<br>(padrão centro)</td>
                <td class="texto-direita" style="background-color: rgb(51, 94, 88); width: 120px;">C1<br>(direita)</td>
            </tr>

             <tr style="height: 120px;">
                <td class="texto-acima" style="width: 120px;">A2<br>(topo)</td>
                <td class="texto-centro" style="width: 180px; background-color: rgb(118, 96, 180);">B2<br>(padrão)</td>
                <td class="texto-abaixo" style="width: 120px;">C2<br>(baixo)</td>
            </tr>


             <tr style="height: 120px;">
                <td class="texto-acima" style="background-color: rgb(71, 53, 46); width: 120px;">A3<br>(topo)</td>
                <td class="texto-abaixo" style="width: 180px;">B3<br>(baixo)</td>
                <td class="texto-centro" style="background-color: rgb(70, 49, 69); width: 120px;">C3<br>(padrão)</td>
            </tr>

            <tr style="height: 70px;">
                <td class="texto-centro"style="width: 120px;">A4</td>
                <td class="texto-direita" style="background-color: rgb(22, 58, 53); width: 180px;">1000<br>(número à direita)</td>
                <td class="texto-centro" style="width: 120px;">C4</td>
            </tr>

        </tbody>

    </table>
</body>
</html>
