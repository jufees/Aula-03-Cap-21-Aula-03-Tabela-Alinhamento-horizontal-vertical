<!DOCTYPE html>
<html lang="pt br">
<head>
    <meta charset="UTF-8">
    <title>Document</title>

     <style>

h1 {
  font-family: "Montserrat Alternates", sans-serif;
  font-weight: 200;
  font-style: italic;
  
}

table {
    border: 3px solid rgb(133, 0, 0);
    border-spacing: 0px;
    border-radius: 10px;
}

table td {
    border: 1px solid rgb(0, 0, 0);
    padding: 8px;
}

.texto-esquerda {
    text-align: left;
}

.texto-centro {
    text-align: center;
}

.texto-direita {
    text-align: right;
}

.texto-acima {
    vertical-align: top;
    text-align: center;
}

.texto-abaixo{
    vertical-align: bottom;
    text-align: center;
}

caption {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 200;
    font-style: Arial;                     
    
}

span {
    display: block;
    float:right;
    font-size: 20px;
}

     </style>


</head>

<body>

     <h1 style="color: rgb(20, 28, 32);">Gabarito - Trabalhando com alinhamento</h1>

    <table style="background-image: url('https://i.pinimg.com/736x/27/b4/94/27b4948a96d7cb4e5bb8552e839b50ec.jpg'); background-size: cover; background-position: center; background-color: rgba(255, 255, 255, 0.3); background-blend-mode: overlay;">

      <caption>Tabela de Alinhamento <span>.☆</span></caption>
        <tbody>

            <tr style="height: 72px;">
                <td class="texto-esquerda" style="width: 120px;">A1<br>(esquerda)</td>
                <td class="texto-centro" style="width: 180px;">B1<br>(padrão centro)</td>
                <td class="texto-direita" style="width: 120px;">C1<br>(direita)</td>
            </tr>

             <tr style="height: 120px;">
                <td class="texto-acima" style="width: 120px;">A2<br>(topo)</td>
                <td class="texto-centro" style="width: 180px;">B2<br>(padrão)</td>
                <td class="texto-abaixo" style="width: 120px;">C2<br>(baixo)</td>
            </tr>


             <tr style="height: 120px;">
                <td class="texto-acima" style="width: 120px;">A3<br>(topo)</td>
                <td class="texto-abaixo" style="width: 180px;">B3<br>(baixo)</td>
                <td class="texto-centro" style="width: 120px;">C3<br>(padrão)</td>
            </tr>

            <tr style="height: 70px;">
                <td class="texto-centro"style="width: 120px;">A4</td>
                <td class="texto-direita" style="width: 180px;">1000<br>(número à direita)</td>
                <td class="texto-centro" style="width: 120px;">C4</td>
            </tr>

        </tbody>

    </table>
</body>
</html>
